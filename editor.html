<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Dimensions — Living Rulebook</title>
<!-- Thin shell: layout + theme in editor/editor.css, everything else in editor/app.js (see game/tools/out/EDITOR_SPEC.md).
     Read-only on the public site; editable when a node serves it at /rules/ (editor/author.js). -->
<link rel="stylesheet" href="editor/editor.css">
<script type="module" src="editor/app.js"></script>
</head>
<body>
<header id="top">
  <button id="back-to-game" class="btn small" aria-label="Back to the game" title="Back to the game">← Back</button>
  <button id="nav-toggle" class="icon-btn" aria-label="Collections" title="Show / hide the collections menu">☰</button>
  <a class="brand" href="#/">Dimensions <small>living rulebook</small></a>
  <div class="search-wrap"><input type="search" id="global-search" placeholder="Search id, name, tag…  ( / )" autocomplete="off" aria-label="Search all loaded collections"></div>
  <button id="menu-toggle" class="icon-btn" aria-label="Actions" title="Actions" hidden>⋯</button>
  <div id="header-actions"></div>
  <span id="mode-badge" class="badge ro">…</span>
</header>
<div id="banner" hidden></div>
<main id="layout">
  <aside id="nav" aria-label="Collections"><div class="nav-head">Collections</div><div id="nav-list"></div></aside>
  <section id="list" aria-label="Entries"><div class="pane-loading">Loading the rules index…</div></section>
  <section id="detail" aria-label="Entry"></section>
</main>
<div id="nav-scrim"></div>
<div id="toasts" aria-live="polite"></div>
<noscript><p style="padding:20px">The rules editor needs JavaScript (ES modules).</p></noscript>
</body>
</html>
